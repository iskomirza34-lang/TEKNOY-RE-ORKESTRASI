<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEKNOYÖRE</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #0a2540;

        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1511379938547-c1f69419868d');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    header {
        background: linear-gradient(135deg, #007BFF, #00AEEF);
        color: white;
        text-align: center;
        padding: 40px 20px;
        font-size: 28px;
        font-weight: bold;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        background: white;
        padding: 15px;
    }

    nav a {
        text-decoration: none;
        color: #007BFF;
        font-weight: bold;
    }

    section {
        padding: 60px 20px;
        max-width: 1000px;
        margin: auto;
    }

    .card {
        background: rgba(255,255,255,0.95);
        border-radius: 15px;
        padding: 30px;
    }

    h2 {
        color: #007BFF;
    }

    .btn {
        display: inline-block;
        padding: 12px 20px;
        background: #007BFF;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        margin-top: 15px;
    }

    footer {
        text-align: center;
        padding: 20px;
        background: #0a2540;
        color: white;
    }
</style>
</head>
<body>

<header>
    GELENEKTEN GELECEĞE TEKNOYÖRE
</header>

<nav>
    <a href="#biz">Biz Kimiz?</a>
    <a href="#muzik">Müzik Listemiz</a>
    <a href="#proje">Projemizin Detayları</a>
</nav>

<section id="biz">
    <div class="card">
        <h2>Biz Kimiz?</h2>
        <a href="ekip.pdf" target="_blank" class="btn">Ekip PDF</a>
    </div>
</section>

<section id="muzik">
    <div class="card">
        <h2>Müzik Listemiz</h2>
        <a href="muzik.pdf" target="_blank" class="btn">Müzik PDF</a>
    </div>
</section>

<section id="proje">
    <div class="card">
        <h2>Projemizin Detayları</h2>
        <a href="proje_detayları.pdf" target="_blank" class="btn">Proje PDF</a>
    </div>
</section>

<footer>
    © 2026 TEKNOYÖRE
</footer>

</body>
</html>
